name: Verify and publish dashboard
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify source and recommendation evidence
        run: |
          python scripts/check_public.py
          python traffic/generate.py
          python analysis/recommend.py
          python infra/generate.py
          python tests/recommendation_test.py
          git diff --exit-code -- traffic/scenarios.jsonl site/data/recommendations.json infra
      - name: Start isolated local integration lab
        run: |
          python scripts/local_env.py
          docker compose up -d --build
      - name: Verify real Redis controls and outage behaviour
        run: python tests/integration.py --outage
      - name: Stop local lab
        if: always()
        run: docker compose down --volumes
  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
