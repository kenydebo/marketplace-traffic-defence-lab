services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 20
    networks: [lab]
  api-a:
    build: .
    environment: &environment
      SESSION_SECRET: ${SESSION_SECRET:?Run python3 scripts/local_env.py first}
      DEMO_LOGIN_PASSWORD: ${DEMO_LOGIN_PASSWORD:?Run python3 scripts/local_env.py first}
      REDIS_URL: redis://redis:6379/0
      INSTANCE_ID: api-a
    ports: ["127.0.0.1:18081:8080"]
    depends_on:
      redis:
        condition: service_healthy
    networks: [lab]
  api-b:
    build: .
    environment:
      <<: *environment
      INSTANCE_ID: api-b
    ports: ["127.0.0.1:18082:8080"]
    depends_on:
      redis:
        condition: service_healthy
    networks: [lab]
networks:
  lab:
